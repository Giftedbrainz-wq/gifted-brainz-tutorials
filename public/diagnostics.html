<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gifted Brainz Diagnostics</title><link rel="icon" href="/assets/favicon.ico"><style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;max-width:820px;margin:0 auto;padding:24px;color:#12263f;line-height:1.5}
h1{font-size:1.5rem;margin:0 0 4px}
p.lead{color:#5a6b85;margin:0 0 20px}
button{background:#082d63;color:#fff;border:0;border-radius:10px;padding:12px 20px;font-size:1rem;cursor:pointer}
button:disabled{opacity:.6;cursor:default}
ul{list-style:none;padding:0;margin:22px 0 0}
li{margin:0 0 10px;padding:12px 14px;border-radius:10px;background:#f4f6fb;border-left:4px solid #b6c2d9;word-break:break-word}
li.ok{border-left-color:#1a8f4c;background:#f1faf4}
li.bad{border-left-color:#c62828;background:#fdf3f3}
li.info{border-left-color:#0b62c4;background:#f1f6fd}
li b{display:block;margin-bottom:2px}
li small{color:#5a6b85;display:block;white-space:pre-wrap}
a{color:#0b62c4}
</style></head><body>
<h1>Gifted Brainz Diagnostics</h1>
<p class="lead">This page checks the connection between this device and the Gifted Brainz server, and reports where the server keeps its data. Use it whenever a login or a page fails.</p>
<button id="run" type="button">Run checks</button>
<ul id="out"></ul>
<p><a href="/login.html">← Back to login</a></p>
<script>
const out=document.getElementById("out"), runButton=document.getElementById("run");
function row(title,detail,cls){
  const li=document.createElement("li");
  li.className=cls||"info";
  const b=document.createElement("b"); b.textContent=title; li.appendChild(b);
  if(detail){const s=document.createElement("small"); s.textContent=detail; li.appendChild(s)}
  out.appendChild(li);
}
async function getJson(url){
  const started=performance.now();
  const r=await fetch(url,{cache:"no-store"});
  const ms=Math.round(performance.now()-started);
  const text=await r.text();
  let data=null;
  try{data=JSON.parse(text)}catch{}
  return {status:r.status, ok:r.ok, data, text, ms, contentType:r.headers.get("content-type")||""};
}

runButton.addEventListener("click",async()=>{
  out.innerHTML=""; runButton.disabled=true;
  try{
    row(navigator.onLine?"This device reports it is online.":"This device reports it is offline.","",navigator.onLine?"ok":"bad");
    row("Site address",location.origin);

    // 0. Were serverless functions published with this deploy at all?
    //    /api/ping has no dependencies and no storage, so it separates
    //    "functions missing" from "the API function is failing".
    let functionsDeployed=null;
    try{
      const ping=await getJson("/api/ping");
      if(ping.ok && ping.data?.functions===true){
        functionsDeployed=true;
        row("Serverless functions are published on this site.",`The deploy probe answered in ${ping.ms} ms.`,"ok");
      }else if(ping.contentType.includes("text/html")||ping.text.trim().startsWith("<")){
        functionsDeployed=false;
        row("Serverless functions were NOT published with this deploy.","The deploy probe returned a web page instead of data. Deploy the site from GitHub (not Netlify Drop) and check Site configuration → Build & deploy: Base directory \".\", Build command empty, Publish directory \"public\", Functions directory \"netlify/functions\".","bad");
      }else{
        row(`The deploy probe answered HTTP ${ping.status}.`,ping.text.slice(0,300),"info");
      }
    }catch(error){
      row("The deploy probe could not be reached.",String(error && error.message || error),"bad");
    }

    // 1. Is the API function reachable at all?

    try{
      const health=await getJson("/api/health");
      if(health.ok && health.data?.ok) row("The API is reachable.",`Answered in ${health.ms} ms.`,"ok");
      else if(health.contentType.includes("text/html")||health.text.trim().startsWith("<"))
        row("The API is not running.",functionsDeployed===true
          ? "Functions are published on this site, but the main API function did not answer. It is failing to start — open Netlify → Logs → Functions → api for the reason."
          : "The server returned a web page instead of data. On Netlify this means the serverless function was not deployed, so the /api/* routes fall through to the site's HTML. Check that netlify/functions/api.mjs is part of the deploy.","bad");

      else row("The API answered with an error.",`HTTP ${health.status}: ${health.text.slice(0,300)}`,"bad");
    }catch(error){
      row("The API could not be reached.",String(error && error.message || error),"bad");
      row("What to do next","Confirm the site is deployed and that you are connected to the internet. If the site loads but this check keeps failing, the serverless function is not being deployed with the site.","info");
    }

    // 2. Can the server actually read and write its data store?
    try{
      const status=await getJson("/api/status");
      if(status.data?.storage){
        const s=status.data.storage;
        const persistent=s.persistent===true;
        row(`Data store: ${s.backend}`,
          persistent
            ? "This store keeps data between deploys. Students, results, materials and announcements are safe across updates."
            : "WARNING: this store is temporary. Data can be lost when the server restarts. On Netlify this means Netlify Blobs is not available to the function — enable Blobs for the site, or set NETLIFY_SITE_ID and NETLIFY_AUTH_TOKEN.",
          persistent?"ok":"bad");
        if(Array.isArray(s.notes)&&s.notes.length) row("Storage notes",s.notes.join("\n"),"info");
      }
      if(status.ok){
        row("The server can read and write its data.",
          `Admin credentials configured: ${status.data.adminConfigured?"yes":"no"}\nRegistered students: ${status.data.students}\nContent pack: ${status.data.contentPackVersion||"unknown"}`,
          status.data.adminConfigured?"ok":"bad");
      }else{
        row("The server cannot use its data store.",`HTTP ${status.status}: ${status.data?.error||status.text.slice(0,300)}`,"bad");
      }
    }catch(error){
      row("The storage check failed.",String(error && error.message || error),"bad");
    }

    // 3. A real (deliberately invalid) login, to prove the login route works.
    try{
      const r=await fetch("/api/login",{method:"POST",cache:"no-store",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({username:"diagnostics-probe-account",password:"diagnostics-probe-password"})});
      const text=await r.text();
      let data=null; try{data=JSON.parse(text)}catch{}
      if(r.status===401) row("The login route is working correctly.","It correctly rejected a deliberately invalid test login, so real logins will be processed.","ok");
      else if(r.status===429) row("The login route is working, but rate limited right now.","Too many recent attempts from this network. Wait a few minutes.","info");
      else if(r.status>=500) row("The login route is failing on the server.",`HTTP ${r.status}: ${data?.error||text.slice(0,300)}`,"bad");
      else row(`The login route answered HTTP ${r.status}.`,(data?.error||text.slice(0,300)),"info");
    }catch(error){
      row("The login route could not be reached.",String(error && error.message || error),"bad");
    }

    // 4. Service worker / cached version, a common cause of "old app" reports.
    if("serviceWorker" in navigator){
      const regs=await navigator.serviceWorker.getRegistrations().catch(()=>[]);
      row(`Service workers registered: ${regs.length}`,"","info");
      const keys=await (window.caches?caches.keys():Promise.resolve([])).catch(()=>[]);
      row("Offline caches",keys.length?keys.join("\n"):"none","info");
      let stored=""; try{stored=localStorage.getItem("gbAppVersion")||""}catch{}
      row("App version recorded on this device",stored||"not set","info");
    }
  }finally{
    runButton.disabled=false;
  }
});
</script></body></html>
